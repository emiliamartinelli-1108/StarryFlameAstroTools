    <style>
      :root {
        --bg: #fff;
        --pn: #fff;
        --pn2: #f2f2f2;
        --bd: #808080;
        --bd2: #c0c0c0;
        --fg: #000;
        --mut: #444;
        --ac: #0000aa;
        --hd: #003399;
        --btn: #d4d0c8;
        --warn: #cc0000;
        --ok: #006600;
        --mono: "Courier New", Courier, monospace;
        color-scheme: light;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        background: var(--bg);
        color: var(--fg);
        font:
          12px/1.4 Verdana,
          Arial,
          Helvetica,
          sans-serif;

        padding: 10px;
        padding-left: calc(10px + env(safe-area-inset-left, 0px));
        padding-right: calc(10px + env(safe-area-inset-right, 0px));
        padding-top: calc(10px + env(safe-area-inset-top, 0px));
        padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px));
      }
      .container {
        max-width: 1400px;
        margin: 0 auto;
      }
      .hd {

        padding-bottom: 4px;
        border-bottom: 3px double var(--hd);
      }
      .hd h1 {

          sans-serif;

      .beta {
        font:
          bold 11px Arial,
          sans-serif;
        vertical-align: super;
        margin-left: 4px;
        color: var(--warn);
      }
      .content-grid {
        display: grid;
        grid-template-columns: 290px minmax(0, 1fr);
        gap: 10px;
        margin-bottom: 10px;
        align-items: start;
      }
      .controls,
      .canvas-container {
        background: var(--pn);
        border: 2px groove var(--bd2);
      }
      .controls {
        padding: 8px;
        min-width: 0;
      }
      .grp {
        font:
          bold 12px Arial,
          Helvetica,
          sans-serif;
        color: #fff;
        background: var(--hd);
        padding: 2px 6px;
      }
      .info-table {
        font-size: 12px;
      }
      .info-row {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        padding: 2px 4px;
        border-bottom: 1px solid #ddd;
      }
      .info-row:nth-child(even) {
        background: #eef2ff;
      }
      .info-label {
        color: var(--mut);
      }
      .info-value {
        text-align: right;
        font-family: var(--mono);
        font-weight: bold;
        color: var(--ac);
      }
      .info-row.warn .info-value {
        color: var(--warn);
      }
      .canvas-container {
        background: #000;
        border: 2px inset var(--bd2);
        overflow: hidden;
      }
      #cv {
        width: 100%;
        height: 68vh;
        min-height: 340px;
        max-height: 780px;
        display: block;
        touch-action: none;
        cursor: crosshair;
      }
      .bar {
        display: flex;
        flex-wrap: wrap;
        gap: 6px 10px;
        align-items: center;
        padding: 6px 8px;
        border-top: 2px groove var(--bd2);
        background: var(--btn);
      }
      .bar .f {
        flex: 1 1 200px;
        margin: 0;
      }
      .bar button {
        min-width: 76px;
      }
      #sbgo {
        min-width: 96px;
        font-weight: bold;
      }
      button,
      select,
      input[type="text"],
      input:not([type]) {
        height: 24px;
        font:
          12px Verdana,
          Arial,
          sans-serif;
        color: var(--fg);
      }
      button {
        padding: 0 12px;
        background: var(--btn);
        border: 2px outset #f0f0f0;
        border-radius: 0;
        cursor: pointer;
      }
      button:hover {
        background: #e4e0d8;
      }
      button:active {
        border-style: inset;
      }
      button.p {
        font-weight: bold;
        color: var(--ac);
      }
      select,
      input[type="text"],
      input:not([type]) {
        padding: 0 4px;
        background: #fff;
        border: 2px inset #c0c0c0;
        border-radius: 0;
        width: 100%;
        min-width: 0;
      }
      input[type="text"],
      input:not([type]) {
        font-family: var(--mono);
      }
      .tabs {
        display: flex;
        gap: 2px;
        border-bottom: 1px solid var(--bd);
        overflow-x: auto;
        margin: 0 0 10px;
        padding: 0 4px;
      }
      .tab {
        flex: none;
        height: 24px;
        padding: 0 12px;
        background: var(--btn);
        border: 1px solid var(--bd);
        border-bottom: 0;
        border-radius: 0;
        color: var(--ac);
        text-decoration: underline;
        position: relative;
        top: 1px;
      }
      .tab:hover {
        background: #e4e0d8;
      }
      .tab.on {
        background: #fff;
        color: #000;
        font-weight: bold;
        text-decoration: none;
        height: 26px;
        top: 1px;
      }
      .tp[hidden] {
        display: none;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
        gap: 10px 20px;
      }
      .grid > * {
        min-width: 0;
      }
      .full {
        grid-column: 1/-1;
      }
      .grp {
        grid-column: 1/-1;
        margin: 4px 0 0;
      }
      .grid > .grp:first-child,
      .tp > .grp:first-child {
        margin-top: 0;
      }
      .f label {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 2px;
        color: #000;
      }
      b {
        font: bold 12px var(--mono);
        color: var(--ac);
      }
      .row {
        display: flex;
        flex-wrap: wrap;
        gap: 6px 12px;
        align-items: center;

        align-items: center;
        gap: 6px;
        cursor: pointer;
      }
      input[type="checkbox"] {

        height: 13px;
      }
      .opts {
        grid-column: 1/-1;
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
        gap: 2px 20px;
      }
      .opts .ck {
        align-items: flex-start;
        padding: 2px 0;
      }
      .opts .ck input {
        margin-top: 2px;
        flex: none;
      }
      .opts .ck span {
        flex: 1;
        min-width: 0;
      }
      .actions {
        grid-column: 1/-1;
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      input[type="range"] {
        width: 100%;
        height: 20px;
        margin: 0;
      }
      .fg {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
        gap: 8px;
        margin-top: 10px;
      }
      .fg canvas {
        width: 100%;
        border: 2px inset var(--bd2);
        background: #000;
        cursor: pointer;
      }
      .ob {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 4px 0;
        border-bottom: 1px solid #ddd;
      }
      .ob span {
        flex: 1;
        min-width: 0;
      }
      .ob i {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        border: 3px solid;
        flex: none;
      }
      .ob button {
        padding: 0 8px;
      }
      .ob em {
        display: block;
        font-style: normal;
        color: var(--mut);
      }
      .lb {
        position: fixed;
        inset: 0;
        background: #000d;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 8px;
        z-index: 500;
        color: #fff;
        font-size: 12px;
      }
      .lb[hidden] {
        display: none;
      }
      .lb img {
        max-width: 92vw;
        max-height: 82vh;
        border: 2px solid #fff;
      }
      .hint {
        color: var(--mut);
        margin-bottom: 8px;
        line-height: 1.4;
      }
      .grid > .hint {
        margin: 0;
      }
      details.adv {
        border-top: 1px solid var(--bd2);
        padding-top: 6px;
      }
      details.adv summary {
        cursor: pointer;
        color: var(--ac);
        margin-bottom: 8px;
      }
      small {
        color: var(--mut);
        font-size: 11px;
      }
      a {
        color: var(--ac);
      }
      @media (max-width: 900px) {
        .content-grid {
          grid-template-columns: 1fr;
        }
        .canvas-col {

      @media (max-width: 600px) {

        }

      body {
        overflow-x: hidden;

        }
      }
      @media (max-width: 900px) {

          height: 56vh;
          height: 56dvh;
          min-height: 300px;
        }
      }
      @media (max-width: 600px) {
        .grid {
          grid-template-columns: 1fr;
        }
        .hd h1 {

        }
        #cv {

      .hd {
        border-bottom: 2px solid var(--hd);
      }
      .controls,
      .canvas-container,
      .fg canvas {

      }
      .canvas-container {
        border-color: #8a93a3;
      }
      .grp {

      }
      .info-row {
        border-bottom: 1px solid #e6e9ef;
      }
      .bar {
        border-top: 1px solid #b8bec9;
        background: #f4f6fa;
      }
      button {
        background: #eef1f6;
        border: 1px solid #b8bec9;
        color: #111;
      }
      button:hover {
        background: #e0e7f2;
        border-color: var(--hd);
      }
      button:active {
        background: #cfd9ea;
        border-style: solid;
      }
      button.p {
        background: var(--hd);
        border-color: var(--hd);
        color: #fff;
        font-weight: bold;
      }
      button.p:hover {
        background: #0a4ac0;
      }
      select,
      input[type="text"],
      input:not([type]) {
        border: 1px solid #b8bec9;

      .tabs {

      .tab:hover {
        background: #eef1f6;
      }
      .tab.on {

      .lb img {

      /* uniform type and controls */
      :root {
        --fs: 12px;
        --fam: Verdana, Geneva, Arial, sans-serif;

        vertical-align: baseline !important;

      }
      button,
      select,
      input[type="text"],
      input:not([type]),
      .tab,
      .tab.on {
        height: var(--h) !important;
      }
      button,
      select,
      input[type="text"],
      input:not([type]) {

      }
      select {

      .controls {

      body.dk .seg {

        color: #8fa8ff;

      .tab[hidden] {

      }
      .ob.sel {

      }
      .ob {
        cursor: pointer;
      }
      #selh {
        transition: none;
      }

      /* ---- square, flat widgets throughout ---- */
      .controls,
      .canvas-container,
      .mb-panel,
      #tourcard,
      #tourhl,
      #cv,
      .fg canvas,
      .lb img,
      #mc,
      .svrow,
      .svrow img,
      button,
      select,
      input,
      .seg,
      .seg button,
      .grp,
      .tab,
      .info-table,
      .bar,
      .ob.sel {
        border-radius: 0 !important;
      }
      .canvas-container {
        overflow: hidden;
      }
      .info-table {
        border: 1px solid #e6e9ef;

      }

      }

        border-color: #222;
      }
      .info-row:last-child {
        border-bottom: 0;
      }
      .ob i,
      .bcr i {
        border-radius: 50% !important;
      }
      /* desktop: two columns now that the side panel is gone */
      @media (min-width: 1100px) and (min-height: 560px) {
        .container {
          grid-template-columns: minmax(0, 1fr) minmax(340px, 420px) !important;
        }
        .canvas-col {
          grid-column: 1 !important;
        }

          grid-column: 2 !important;
        }
      }
      @media (min-width: 1600px) {

          grid-template-columns: minmax(0, 1fr) 460px !important;

      /* ---- sandbox lists ---- */
      #vg {

      }
      #ol,
      #bcl {

      #bcl small {
        display: block;
        padding: 4px 6px;
      }
      .ob {
        padding: 3px 6px;
        border: 0;
        border-bottom: 1px solid #ddd;
        margin: 0;
      }
      .ob:last-child {
        border-bottom: 0;
      }
      .ob:hover {
        background: #eef2ff;
      }
      .ob.sel {
        background: var(--hd);

        outline: 1px dotted #fff;
        outline-offset: -3px;
      }
      .ob.sel span {
        color: #fff;
      }
      body.dk #ol,
      body.dk #bcl {
        background: #0b0b0b;
      }
      body.dk .ob,
      body.dk .bcr {
        border-bottom-color: #222;
      }
      body.dk .ob:hover {
        background: #121826;
      }
      /* ---- sandbox-only controls ---- */
      .bcr {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 3px 6px;
        border-bottom: 1px solid #ddd;
      }
      .bcr:last-child {
        border-bottom: 0;
      }
      .bcr i {
        width: 12px;
        height: 12px;
        flex: none;
        border: 3px solid;
      }
      .bcr span {
        flex: 1;
        min-width: 0;
      }
      .bcr select {
        width: auto;
        flex: none;
      }
      body:not(.sbm) .sbo {
        display: none !important;
      }
      [hidden] {
        display: none !important;
      }
      button:disabled,
      select:disabled,
      input:disabled {
        opacity: 0.45;
        cursor: default;
      }
    </style>
    <style id="sfat-align">
      /* Layout aligned with the StarryFlameAstroTools main page: same title size, page padding, gaps, panel padding,
         section bars and table rows. Kept in one block at the end so it is easy to adjust. */
      body {
        line-height: 1.5;
        padding: 10px;
        padding-left: calc(10px + env(safe-area-inset-left, 0px));
        padding-right: calc(10px + env(safe-area-inset-right, 0px));
        padding-top: calc(10px + env(safe-area-inset-top, 0px));
        padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px));
      }
      .container {
        gap: 12px;
      }
      .hd h1 {
        font-size: calc(var(--fs) * 2.6) !important;
        line-height: 1.15;
      }
      .controls {
        padding: 12px;
      }
      .grp {
        padding: 3px 8px;
      }
      .info-row {
        padding: 4px 8px;
      }
      button:focus-visible,
      a:focus-visible,
      .tab:focus-visible {
        outline: 2px solid var(--hd);
        outline-offset: 2px;
      }
      body.dk button:focus-visible,
      body.dk a:focus-visible,
      body.dk .tab:focus-visible {
        outline-color: #6f8fff;
      }
      /* tab strip: always one row with its own horizontal scroll bar, on every screen size */
      .tabs,
      .controls .tabs {
        flex-wrap: nowrap !important;
        overflow-x: scroll !important;
        overflow-y: hidden !important;
        scroll-snap-type: none !important;
        scrollbar-width: auto !important;
        scrollbar-color: auto !important; /* same native scroll bar as the vertical one */
        -webkit-overflow-scrolling: touch;
        margin-top: -12px;
        padding-top: 12px;
        top: -12px;
      }
      .tab {
        flex: none;
        white-space: nowrap;
      }
      @media (max-width: 600px) {
        body {
          padding: 6px;
          padding-left: calc(6px + env(safe-area-inset-left, 0px));
          padding-right: calc(6px + env(safe-area-inset-right, 0px));
        }
        .hd h1 {
          font-size: calc(var(--fs) * 1.8) !important;
        }
        .controls {
          padding: 8px;
        }
        .tabs,
        .controls .tabs {
          margin-top: -8px;
          padding-top: 8px;
          top: -8px;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <header class="hd">
        <h1>StarryFlameSPH</h1>
        <div class="seg" id="modes" role="group" aria-label="Mode">
          <button type="button" data-m="sc" class="on">Scenarios</button>
          <button type="button" data-m="sb">Sandbox</button>
        </div>
        <button id="tourb" type="button" title="Take a guided tour">Tour</button>
        <select id="thm" title="Theme">
          <option value="a">Auto theme</option>
          <option value="w">Light theme</option>
          <option value="k">Dark theme</option>

      <div class="content-grid">
        <div class="canvas-col">
          <div class="canvas-container">
            <canvas id="cv"></canvas>
            <div class="bar">

                id="sbgo"
                class="p sbo"
                type="button"
                title="Start the simulation, or go back to editing the bodies"
              >
                Start
              </button>
              <button id="pl" class="p">Pause</button>
              <button id="rs">Restart</button>
              <button id="prs" type="button" title="Put every physics setting back to its default and restart the run">
                Reset Parameters
              </button>
              <button id="rv">Reset Camera</button>
              <button id="xpd" type="button" title="Fill the screen with the simulation">Expand</button>
            </div>
          </div>
        </div>
      </div>
      <div class="controls">
        <nav class="tabs">
          <button class="tab on" data-t="scn" data-m="sc">Scenario</button>
          <button class="tab" data-t="obj" data-m="sb" hidden>Bodies</button>
          <button class="tab" data-t="orb" data-m="sb" hidden>Orbits</button>
          <button class="tab" data-t="sta">Status</button>
          <button class="tab" data-t="phy">Physics</button>
          <button class="tab" data-t="dsp">Appearance</button>
          <button class="tab" data-t="snp">Snapshots</button>
          <button class="tab" data-t="mov">GIF / Video</button>
          <button class="tab" data-t="sav" data-m="sb" hidden>Save / Load</button>
        </nav>
        <section class="tp" id="t_scn">
          <div class="grid">
            <h4 class="grp">Scenario</h4>
            <div class="f full">
              <label for="pre">Preset</label>
              <select id="pre"></select>
            </div>
            <h4 class="grp">Collision</h4>
            <div class="f">
              <label for="tm">
                Total Mass

              </label>
              <input id="tm" type="range" min="-10" max="0.6" step="0.01" value="0" />
            </div>
            <div class="f">
              <label for="g">
                Body 2 Mass Ratio
                <b id="g_v"></b>
              </label>
              <input id="g" type="range" min="0.02" max="1" step="0.001" />
            </div>
            <div class="f">
              <label for="b">
                Impact Angle
                <b id="b_v"></b>
              </label>
              <input id="b" type="range" min="0" max="1.6" step="0.01" />
            </div>
            <div class="f">
              <label for="vi">
                Impact Speed
                <b id="vi_v"></b>
              </label>
              <input id="vi" type="range" min="0.1" max="4" step="0.05" />
            </div>
            <div class="f">
              <label for="sd">
                Starting Distance
                <b id="sd_v"></b>
              </label>
              <input id="sd" type="range" min="0" max="10" step="0.1" value="0" />
            </div>
            <h4 class="grp">Body 1</h4>
            <div class="f">
              <label for="k1">Composition</label>
              <select id="k1">
                <option value="0">Rocky</option>
                <option value="1">Icy</option>
                <option value="2">Iron</option>
              </select>
            </div>
            <div class="f">
              <label for="cf">
                Core
                <b id="cf_v"></b>
              </label>
              <input id="cf" type="range" min="0" max="80" step="1" value="30" />
            </div>
            <div class="f">
              <label for="sp">
                Rotation
                <b id="sp_v"></b>
              </label>
              <input id="sp" type="range" min="-0.6" max="0.6" step="0.01" />
            </div>
            <div class="f">
              <label for="c1">Colour</label>
              <select id="c1"></select>
            </div>
            <h4 class="grp">Body 2</h4>
            <div class="f">
              <label for="k2">Composition</label>
              <select id="k2">
                <option value="0">Rocky</option>
                <option value="1">Icy</option>
                <option value="2">Iron</option>
              </select>
            </div>
            <div class="f">
              <label for="cfi">
                Core
                <b id="cfi_v"></b>
              </label>
              <input id="cfi" type="range" min="0" max="80" step="1" value="30" />
            </div>
            <div class="f">
              <label for="spi">
                Rotation
                <b id="spi_v"></b>
              </label>
              <input id="spi" type="range" min="-0.6" max="0.6" step="0.01" value="0" />
            </div>
            <div class="f">
              <label for="c2">Colour</label>
              <select id="c2"></select>
            </div>
            <div class="info-table full" id="scinf"></div>
          </div>
        </section>
        <section class="tp" id="t_obj" hidden>
          <div class="grid">

              <label for="sbp">Start From</label>
              <select id="sbp"></select>
            </div>
            <div class="actions full">
              <button id="be">Edit</button>
              <button id="bc">Clear</button>

              <button id="bundo" type="button" title="Undo the last change to the bodies" disabled>Undo</button>
              <button id="bredo" type="button" title="Redo what was undone" disabled>Redo</button>
            </div>
            <h4 class="grp">Bodies</h4>
            <div id="ol" class="full"></div>
            <h4 class="grp" id="selh">New Body</h4>

              <label for="on">Name</label>
              <input id="on" type="text" maxlength="24" placeholder="Body name" />
            </div>
            <div class="f">
              <label for="oh">Colour</label>
              <select id="oh">
                <option value="blue">Blue</option>
                <option value="red">Red</option>
                <option value="green">Green</option>
                <option value="yellow">Yellow</option>
                <option value="orange">Orange</option>
                <option value="purple">Purple</option>
                <option value="pink">Pink</option>
                <option value="cyan">Cyan</option>
              </select>
            </div>
            <div class="f">
              <label for="tpl">Size Preset</label>
              <select id="tpl">
                <option value="">Custom</option>
                <option value="1">Earth</option>
                <option value="0.107">Mars</option>
                <option value="0.0123">Moon</option>
                <option value="0.00218">Pluto</option>
                <option value="0.000266">Charon</option>
                <option value="0.005">Small moon</option>
              </select>
            </div>
            <div class="f">
              <label for="ok">Composition</label>
              <select id="ok">
                <option value="0">Rocky</option>
                <option value="1">Icy</option>
                <option value="2">Iron</option>
              </select>
            </div>
            <div class="f">
              <label for="om">
                Mass
                <b id="om_v"></b>
              </label>
              <input id="om" type="range" min="-5" max="0.6" step="0.01" value="0" />
            </div>
            <div class="f">
              <label for="ocf">
                Core
                <b id="ocf_v"></b>
              </label>
              <input id="ocf" type="range" min="0" max="80" step="1" value="30" />
            </div>
            <div class="f">
              <label for="oy">
                Rotation
                <b id="oy_v"></b>
              </label>
              <input id="oy" type="range" min="-0.6" max="0.6" step="0.01" value="0" />
            </div>
            <div class="f">

              </label>

                <input type="checkbox" id="s_lbl" checked />

    <script id="app">

      const FIXED = Object.fromEntries(
        Object.entries({
          tr: false,
          pm: true,
          cbs: true,
          mcb: true,
          tt: 24,
          eos: "1",
          bt: 1.6,
          gh: true,
          tg: true,
          ic: true,
          hf: true,
          co: true,
          rh: false,
          bx: 0.6,
          br: 0.5,
          pal: 0,
          rw: 1,
        }).map(([k, v]) => [
          k,
          typeof v === "boolean" ? { checked: v, addEventListener() {} } : { value: v, addEventListener() {} },
        ]),
      );
      const q = (id) => FIXED[id] || document.getElementById(id),
        PI = Math.PI,
        GG = 0.5;
      /* the page has no status line: say() is kept as a silent hook so every call site stays valid */
      let SBK = null; /* sandbox bodies kept safe while Scenarios is open */
      const say = () => {};
      function overlapNote() {
        for (let i = 0; i < objs.length; i++)
          for (let j = i + 1; j < objs.length; j++)
            if (Math.hypot(objs[i].x - objs[j].x, objs[i].y - objs[j].y) < objR(objs[i]) + objR(objs[j]))
              return nm(i) + " and " + nm(j) + " overlap. They will collide as soon as you press Start; drag one away if that is not what you want.";
        return "";
      }
      /* Undo / Redo for sandbox edits: the bodies are remembered whenever they have been still for a moment after a change */
      const HIST = { base: null, cur: null, t: 0, undo: [], redo: [], ui: "" },
        objsSig = () => JSON.stringify(objs);
      function histReset() {
        HIST.base = objsSig();
        HIST.cur = null;
        HIST.undo = [];
        HIST.redo = [];
        HIST.ui = "";
      }
      function histCommit(s) {
        HIST.undo.push(HIST.base);
        if (HIST.undo.length > 60) HIST.undo.shift();
        HIST.base = s;
        HIST.cur = null;
        HIST.redo = [];
      }
      function histTick() {
        const act = SB && edit,
          s = act ? objsSig() : null;
        if (act) {
          if (HIST.base === null) HIST.base = s;
          if (s !== HIST.base) {
            if (HIST.cur !== s) {
              HIST.cur = s;
              HIST.t = performance.now();
            } else if (!drag && performance.now() - HIST.t > 450) histCommit(s);
          }
        }
        const key = act + "|" + HIST.undo.length + "|" + HIST.redo.length + "|" + (act && s !== HIST.base);
        if (key !== HIST.ui) {
          HIST.ui = key;
          q("bundo").disabled = !(act && (HIST.undo.length || s !== HIST.base));
          q("bredo").disabled = !(act && HIST.redo.length);
        }
      }
      function histGo(dir) {
        if (!(SB && edit)) return say("Press Edit to go back to your bodies, then Undo and Redo work.", "warn");
        const s = objsSig();
        if (s !== HIST.base) histCommit(s);
        const from = dir < 0 ? HIST.undo : HIST.redo,
          to = dir < 0 ? HIST.redo : HIST.undo;
        if (!from.length) return say(dir < 0 ? "Nothing to undo." : "Nothing to redo.");
        to.push(HIST.base);
        HIST.base = from.pop();
        HIST.cur = null;
        objs = JSON.parse(HIST.base);
        if (selObj >= objs.length) selObj = -1;
        selSync();
        renderObjs();
        histTick();
        say(dir < 0 ? "Undone." : "Redone.", "ok");
      }
      q("bundo").onclick = () => histGo(-1);
      q("bredo").onclick = () => histGo(1);
      /* helpers shared by the sliders: masses sit on log sliders (log10 of Earth masses), and every body is rocky (basalt mantle, iron core) or icy (ice mantle, rock core) */
      const TMs = () => 10 ** +q("tm").value,
        OM = () => +(10 ** +q("om").value).toPrecision(3),
        matsOf = (ice) => (ice === 2 ? [1, 1] : ice ? [0, 2] : [1, 0]) /* [core material, mantle material]; ice: 0 rocky, 1 icy, 2 iron */,
        fmMass = (M) => (M >= 1e-4 ? +M.toPrecision(3) + " M\u2295" : (M * 5.972e24).toExponential(1) + " kg");
      const MT = [
        {
          r0: 0.118,
          A: 0.0187,
          B: 0.0187,
          E0: 7.8,
          Ei: 0.0755,
          Ec: 0.291,
          a: 0.5,
          b: 1.5,
          al: 5,

          cv: 800,
          col: [165, 135, 105],

        {
          r0: 0.343,
          A: 0.0895,
          B: 0.0734,
          E0: 0.152,
          Ei: 0.0384,
          Ec: 0.139,
          a: 0.5,
          b: 1.5,
          al: 5,
          be: 5,
          cv: 450,
          col: [240, 140, 40],
        },
        {
          r0: 0.0397,
          A: 0.00662,
          B: 0.00662,
          E0: 0.16,
          Ei: 0.0124,
          Ec: 0.0486,
          a: 0.3,
          b: 0.1,
          al: 10,
          be: 5,
          cv: 2100,
          col: [150, 205, 240],
        },
      ];
      const HUE = {
        red: ["#ff9a00", "#ff2a2e"],
        blue: ["#ff9a00", "#0070ff"],
        green: ["#ff9a00", "#00e05a"],
        yellow: ["#ff8a2a", "#ffc800"] /* warm smiley-face yellow: no green in it */,
        orange: ["#ffd400", "#ff7a00"],
        purple: ["#ffd400", "#9b3dff"],
        pink: ["#ffd400", "#ff3fb4"],
        cyan: ["#ff9a00", "#00d9e0"],
        /* Ice, Slate and Rust are no longer offered; they stay here so older saved systems still load */
        ice: ["#d9a867", "#e4f2ff"],
        slate: ["#d9a867", "#9fb0c4"],
        rust: ["#e8c9a0", "#c0653a"],
      };
      const pair = (a, b) => Object.assign([...HUE[a], ...HUE[b]], { names: [a, b] });
      /* Collision presets. M = total mass in Earth masses, g = body 2 / body 1 mass ratio, b = impact parameter
   (0 head-on, 1 grazing), vi = contact speed in units of the mutual escape speed (1 = just escape speed),
   sp = body 1 spin as a fraction of breakup spin, tk = starting temperature (K), c = object colours. */
      const PRE = [
        { n: "Blank sandbox", sb: 1 },
        { n: "Side-grazing impact", M: 1, g: 0.13, b: 0.7, vi: 1.05, sp: 0, tk: 1500, c: pair("blue", "yellow") },
        { n: "Fast-spinner impact", M: 1, g: 0.05, b: 0.6, vi: 1.17, sp: 0.6, tk: 1500, c: pair("blue", "red") },
        { n: "Head-on merger", M: 1, g: 1, b: 0, vi: 1.04, sp: 0, tk: 1500, c: pair("blue", "green") },
        { n: "Grazing merger", M: 1, g: 0.5, b: 0.6, vi: 1.02, sp: 0, tk: 1500, c: pair("blue", "yellow") },
        { n: "Hit and run", M: 1, g: 0.3, b: 0.85, vi: 1.22, sp: 0, tk: 1500, c: pair("purple", "orange") },
        { n: "Disruption", M: 1, g: 0.4, b: 0.15, vi: 2.69, sp: 0, tk: 1500, c: pair("red", "cyan") },
        { n: "Mantle stripping", M: 0.12, g: 0.2, b: 0.5, vi: 3.26, sp: 0, cf: 70, tk: 1500, c: pair("yellow", "purple") },
        { n: "Small impact", M: 1, g: 0.03, b: 0.4, vi: 1.8, sp: 0, tk: 1500, c: pair("blue", "red") },
        { n: "Tidal flyby", M: 1, g: 0.15, b: 1.1, vi: 1, sp: 0, tk: 1500, c: pair("cyan", "pink") },
      ];

      const HN = ["blue", "red", "green", "yellow", "orange", "purple", "pink", "cyan"];
      const mkO = (x, y, m, cf, v, d, h) => ({
        x,
        y,
        m,
        cf,
        mant: "basalt",
        s: Math.round(v * 791) / 100,
        d,
        sp: 0,
        h,
        cc: HUE[h][0],
        mc: HUE[h][1],
      });
      PRE.push({
        n: "Big and small body",
        sb: 1,
        objs: [mkO(0, 0, 1, 0.3, 0, 0, "blue"), mkO(4.5, 0, 0.0123, 0.2, Math.sqrt((1.0123 * GG) / 4.5), 90, "yellow")],
      });
      PRE.push({
        n: "Binary bodies",
        sb: 1,
        objs: [
          mkO(-1.667, 0, 1, 0.3, (Math.sqrt(0.3 * GG) * 0.5) / 1.5, 270, "blue"),
          mkO(3.333, 0, 0.5, 0.3, Math.sqrt(0.3 * GG) / 1.5, 90, "green"),
        ],
      });
      PRE.push({
        n: "Planet with two moons",
        sb: 1,
        objs: [
          mkO(0, 0, 1, 0.3, 0, 0, "blue"),
          mkO(6, 0, 0.0123, 0.2, Math.sqrt((1.0123 * GG) / 6), 90, "yellow"),
          mkO(-9, 0, 0.003, 0.2, Math.sqrt((1.0153 * GG) / 9), 270, "orange"),
        ],
      });
      PRE.push({
        n: "Hyperbolic flyby",
        sb: 1,
        objs: [mkO(0, 0, 1, 0.3, 0, 0, "blue"), mkO(-9, -3.4, 0.107, 0.25, 6.4 / 7.91, 0, "red")],
      });
      const h2r = (h) => [1, 3, 5].map((i) => parseInt(h.substr(i, 2), 16));
      const pre = q("pre"),
        sbp = q("sbp");
      PRE.forEach((p, i) => (p.sb ? sbp : pre).add(new Option(p.n, i)));
      [q("c1"), q("c2")].forEach((e) => HN.forEach((h) => e.add(new Option(h[0].toUpperCase() + h.slice(1), h))));
      const IDS = [
        "bq",
        "gs",
        "sg",
        "al",
        "ch",
        "dc",
        "tn",
        "xs",
        "cd",
        "mf",
        "eb",
        "st",
        "as",
        "cf",
        "ocf",
        "om",
        "os",
        "od",
        "oy",
        "oe",
        "n",
        "g",
        "b",
        "vi",
        "spi",
        "sp",
        "tk",
        "sw",
        "ps",
        "tm",
        "cfi",
        "sd",
        "tl",
        "ot",
        "md",
        "mz",
        "mw",
      ];
      function lbl() {
        GM = +q("gs").value * GSC;
        SGF = +q("sg").value;
        CHV = +q("ch").value;
        DCL = +q("dc").value;
        TK = +q("tk").value;
        VA = +q("al").value;
        STR = +q("st").value;
        TN = +q("tn").value;
        XE = +q("xs").value;
        CL = +q("cd").value;
        IDS.forEach((k) => (q(k + "_v").textContent = q(k).value + (UNITS[k] || "")));
        q("ot_v").textContent = +q("ot").value ? q("ot").value + " K" : "Default";
        q("mf_v").textContent = +q("mf").value <= 0 ? "Real" : "×" + q("mf").value;
        q("st_v").textContent = STR <= 0 ? "Liquid" : STR >= 1 ? "Solid" : Math.round(STR * 100) + "% solid";
        ["sw", "mw"].forEach((k) => {
          const v = +q(k).value;
          q(k + "_v").textContent = v >= 1 ? +v.toPrecision(3) + " thousand km" : +(v * 1000).toPrecision(3) + " km";
        });
        const b = +q("b").value;
        q("b_v").textContent =
          b <= 1 ? b.toFixed(2) + " · " + Math.round((Math.asin(b) * 180) / PI) + "°" : b.toFixed(2) + " · flyby";
        q("sd_v").textContent = +q("sd").value ? q("sd").value + " radii" : "Auto";
        if (SB) sbInfo();
        else scInfo();
        /* an all-iron body has no separate core, so its Core slider is switched off */
        q("cf").disabled = q("k1").value === "2";
        q("cfi").disabled = q("k2").value === "2";
        q("ocf").disabled = (SB && !edit) || q("ok").value === "2";
      }
      /* units shown after slider values */
      const UNITS = {
        bq: "\u00d7",
        om: " M\u2295",
        tm: " M\u2295",
        cfi: " % of mass",
        tl: " h",
        cf: " % of mass",
        ocf: " % of mass",
        os: " km/s",
        od: "\u00b0",
        n: " particles",
        tk: " K",
        ot: " K",
        vi: " \u00d7 escape",
        sw: " thousand km",
        mw: " thousand km",
        md: " h",
        mz: " px",
        eb: " ms",
      };
      function tab(n) {
        document.querySelectorAll(".tab").forEach((x) => x.classList.toggle("on", x.dataset.t === n));
        document.querySelectorAll(".tp").forEach((p) => (p.hidden = p.id !== "t_" + n));
      }
      /* the fixed snapshot view width follows the size of the system that was just built (thousand km) */
      function fitSnapView() {
        const w = 7 * (RT + RI) * 6.4 * LK;
        ["sw", "mw"].forEach((id) => {
          const e = q(id);
          e.min = w / 8;
          e.max = w * 4;
          e.step = w / 100;
          e.value = w;
        });
        lbl();
      }
      const curPre = () => PRE[SB ? +sbp.value : +pre.value];
      function applyPre() {
        const p = curPre(),
          blank = SB && !(p.objs && p.objs.length);
        if (!SB) {
          ["g", "b", "vi", "sp"].forEach((k) => (q(k).value = p[k]));
          q("spi").value = p.spi ?? 0;
          q("tm").value = Math.log10(p.M || 1);

        if (st.mode && st.mode !== (PRE[st.pre].sb ? "sandbox" : "scenario"))
          return "The mode in this save does not match its scenario.";
        if (st.sim) {
          const s = st.sim;
          if (!(s.N > 0 && s.N <= 20000)) return "The particle count in this save is out of range.";
          for (const k of [...SAVE_F32, ...SAVE_U8]) {
            if (typeof s.a[k] !== "string") return "The particle data is incomplete.";
            if (s.a[k].length > 4 * s.N * 4 + 16) return "The particle data is larger than expected.";
          }
          for (const k of ["T", "PM", "RT", "RI", "MTOT"])
            if (!Number.isFinite(s[k])) return "The save contains invalid numbers.";

          document.body.appendChild(t);
          document.getElementById("tourskip").onclick = tourEnd;
          document.getElementById("tourback").onclick = () => tourShow(tourI - 1);
          document.getElementById("tournext").onclick = () =>
            tourI >= TOUR.length - 1 ? tourEnd() : tourShow(tourI + 1);
          addEventListener("resize", () => tourI >= 0 && tourPlace());
          addEventListener("scroll", () => tourI >= 0 && tourPlace(), { passive: true });
        }
        return t;
      }
      /* a step's sel can list several elements with "|"; the highlight covers all the visible ones together */
      function tourEls(sel) {
        const out = [];
        String(sel)
          .split("|")
          .forEach((x) => {
            const e = document.querySelector(x);
            if (!e) return;
            const r = e.getBoundingClientRect();
            if (r.width >= 1 && r.height >= 1) out.push(e);
          });
        return out;
      }
      function tourBox(sel) {
        let els = tourEls(sel);
        if (!els.length) els = tourEls(".controls");
        if (!els.length) return null;
        let l = 1e9,
          t = 1e9,
          rr = -1e9,
          bb = -1e9;
        els.forEach((e) => {
          const r = e.getBoundingClientRect();
          l = Math.min(l, r.left);
          t = Math.min(t, r.top);
          rr = Math.max(rr, r.right);
          bb = Math.max(bb, r.bottom);
        });
        return { left: l, top: t, right: rr, bottom: bb, width: rr - l, height: bb - t };
      }
      function tourPlace() {
        if (tourI < 0) return;
        const st = TOUR[tourI],
          hl = document.getElementById("tourhl"),
          card = document.getElementById("tourcard"),
          r = tourBox(st.sel);
        if (!r) return;
        const pad = 6;
        hl.style.left = r.left - pad + "px";
        hl.style.top = r.top - pad + "px";
        hl.style.width = r.width + 2 * pad + "px";
        hl.style.height = r.height + 2 * pad + "px";
        const cw = card.offsetWidth,
          ch = card.offsetHeight,
          vw = innerWidth,
          vh = innerHeight;
        let top = r.bottom + 14;
        if (top + ch > vh - 8) top = r.top - ch - 14;
        if (top < 8) top = Math.max(8, Math.min(vh - ch - 8, r.top + 12));
        card.style.top = top + "px";
        card.style.left = Math.max(8, Math.min(vw - cw - 8, r.left)) + "px";
      }
      function tourShow(i) {
        const t = tourEl();
        tourI = Math.max(0, Math.min(TOUR.length - 1, i));
        const st = TOUR[tourI];
        if (st.mode && (st.mode === "sb") !== SB) {
          if (st.mode === "sb") {
            SBK = null; /* the tour shows its own example bodies; your own sandbox is put back when it ends */
            sbp.value = PRE.findIndex((x) => x.n === "Big and small body");
          }
          setMode(st.mode);
          tourTouched = true;
        }
        if (st.tab) tab(st.tab);
        if (st.act) st.act();
        t.hidden = false;
        document.getElementById("tourn").textContent = "Step " + (tourI + 1) + " of " + TOUR.length;
        document.getElementById("tourt").textContent = st.t;
        document.getElementById("tourp").textContent = st.p;
        document.getElementById("tourback").style.visibility = tourI ? "visible" : "hidden";
        document.getElementById("tournext").textContent = tourI >= TOUR.length - 1 ? "Done" : "Next";
        const el = tourEls(st.sel)[0] || tourEls(".controls")[0];
        if (el) {
          el.scrollIntoView({ block: "center", behavior: "auto" });
          const stick = document.querySelector(".canvas-col"),
            bx = tourBox(st.sel);
          if (stick && bx && getComputedStyle(stick).position === "sticky" && !el.closest(".canvas-col")) {
            const sb = stick.getBoundingClientRect().bottom;
            if (bx.top < sb + 12) scrollBy(0, bx.top - sb - 12);
          }
        }
        setTimeout(tourPlace, 30);
      }
      function tourEnd() {
        tourI = -1;
        const t = document.getElementById("tour");
        if (t) t.hidden = true;
        if (tourSave && tourTouched) {
          try {
            loadSim(tourSave);
          } catch (e) {}
        }
        SBK = tourSBK;
        tourSBK = null;
        histReset();
        run = tourRun;
        q("pl").textContent = run ? "Pause" : "Play";
        tab(tourTab);
        tourSave = null;
        tourTouched = false;
        try {
          localStorage.setItem("sfs_tour", "1");
        } catch (e) {}
      }
      function tourStart() {
        try {
          tourSave = simState("tour", true);
        } catch (e) {
          tourSave = null;
        }
        tourTouched = false;
        tourSBK = SBK ? SBK.map((o) => ({ ...o })) : null;
        tourTab = (document.querySelector(".tab.on") || {}).dataset?.t || "scn";
        /* the simulation is paused for the whole tour and put back as it was afterwards */
        tourRun = run;
        run = false;
        q("pl").textContent = "Play";
        tab(tourTab);
        tourShow(0);
      }
      rs();
      q("cbp").onchange = () => setPalette(q("cbp").value === "1");
      try {
        if (localStorage.getItem("sfs_pal") === "cb") {
          q("cbp").value = "1";
          setPalette(true);
        }
      } catch (e) {}
      document.querySelectorAll("#modes button").forEach(
        (b) =>
          (b.onclick = () => {
            if ((b.dataset.m === "sb") !== SB) setMode(b.dataset.m);
          }),
      );
      setMode("sc");
      upd();
      frame();
      svWire();
      q("tourb").onclick = tourStart;
      q("xpd").onclick = () => {
        const on = document.querySelector(".canvas-col").classList.toggle("big");
        document.body.classList.toggle("noscroll", on);
        q("xpd").textContent = on ? "Close" : "Expand";
        rs();
      };
      svFromHash();
      try {
        if (!localStorage.getItem("sfs_tour") && !location.hash) setTimeout(tourStart, 1800);
      } catch (e) {}
    </script>
  </body>
</html>
