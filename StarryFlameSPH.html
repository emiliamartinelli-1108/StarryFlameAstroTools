<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#003399" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>StarryFlameSPH</title>

    <style>
      :root {
        --bg: #fff;
        --pn: #fff;
        --pn2: #f2f2f2;
        --bd: #808080;
        --bd2: #c0c0c0;
        --fg: #000;
        --mut: #444;
        --ac: #0000aa;
        --hd: #003399;
        --btn: #d4d0c8;
        --warn: #cc0000;
        --ok: #006600;
        --r: 0;
        --mono: "Courier New", Courier, monospace;
        color-scheme: light;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        background: var(--bg);
        color: var(--fg);
        font:
          12px/1.4 Verdana,
          Arial,
          Helvetica,
          sans-serif;
        min-height: 100vh;
        padding: 10px;
        padding-left: calc(10px + env(safe-area-inset-left, 0px));
        padding-right: calc(10px + env(safe-area-inset-right, 0px));
        padding-top: calc(10px + env(safe-area-inset-top, 0px));
        padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px));
      }
      .container {
        max-width: 1400px;
        margin: 0 auto;
      }
      .hd {
        margin-bottom: 10px;
        padding-bottom: 4px;
        border-bottom: 3px double var(--hd);
      }
      .hd h1 {
        margin: 0;
        font:
          bold 22px Arial,
          Helvetica,
          sans-serif;
        color: var(--hd);
      }
      .beta {
        font:
          bold 11px Arial,
          sans-serif;
        vertical-align: super;
        margin-left: 4px;
        color: var(--warn);
      }
      .content-grid {
        display: grid;
        grid-template-columns: 290px minmax(0, 1fr);
        gap: 10px;
        margin-bottom: 10px;
        align-items: start;
      }
      .info-panel,
      .controls,
      .canvas-container {
        background: var(--pn);
        border: 2px groove var(--bd2);
      }
      .info-panel,
      .controls {
        padding: 8px;
        min-width: 0;
      }
      .info-panel h3,
      .grp {
        font:
          bold 12px Arial,
          Helvetica,
          sans-serif;
        color: #fff;
        background: var(--hd);
        padding: 2px 6px;
      }
      .info-panel h3 {
        margin: 0 0 4px;
      }
      .info-panel h3:not(:first-child) {
        margin-top: 10px;
      }
      .info-table {
        font-size: 12px;
      }
      .info-row {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        padding: 2px 4px;
        border-bottom: 1px solid #ddd;
      }
      .info-row:nth-child(even) {
        background: #eef2ff;
      }
      .info-label {
        color: var(--mut);
      }
      .info-value {
        text-align: right;
        font-family: var(--mono);
        font-weight: bold;
        color: var(--ac);
      }
      .info-row.warn .info-value {
        color: var(--warn);
      }
      .info-panel select {
        margin-bottom: 4px;
      }
      .canvas-container {
        background: #000;
        border: 2px inset var(--bd2);
        overflow: hidden;
      }
      #cv {
        width: 100%;
        height: 68vh;
        min-height: 340px;
        max-height: 780px;
        display: block;
        touch-action: none;
        cursor: crosshair;
      }
      .bar {
        display: flex;
        flex-wrap: wrap;
        gap: 6px 10px;
        align-items: center;
        padding: 6px 8px;
        border-top: 2px groove var(--bd2);
        background: var(--btn);
      }
      .bar .f {
        flex: 1 1 200px;
        margin: 0;
      }
      .bar button {
        min-width: 76px;
      }
      button,
      select,
      input[type="text"],
      input:not([type]) {
        height: 24px;
        font:
          12px Verdana,
          Arial,
          sans-serif;
        color: var(--fg);
      }
      button {
        padding: 0 12px;
        background: var(--btn);
        border: 2px outset #f0f0f0;
        border-radius: 0;
        cursor: pointer;
      }
      button:hover {
        background: #e4e0d8;
      }
      button:active {
        border-style: inset;
      }
      button.p {
        font-weight: bold;
        color: var(--ac);
      }
      select,
      input[type="text"],
      input:not([type]) {
        padding: 0 4px;
        background: #fff;
        border: 2px inset #c0c0c0;
        border-radius: 0;
        width: 100%;
        min-width: 0;
      }
      input[type="text"],
      input:not([type]) {
        font-family: var(--mono);
      }
      .tabs {
        display: flex;
        gap: 2px;
        border-bottom: 1px solid var(--bd);
        overflow-x: auto;
        margin: 0 0 10px;
        padding: 0 4px;
      }
      .tab {
        flex: none;
        height: 24px;
        padding: 0 12px;
        background: var(--btn);
        border: 1px solid var(--bd);
        border-bottom: 0;
        border-radius: 0;
        color: var(--ac);
        text-decoration: underline;
        position: relative;
        top: 1px;
      }
      .tab:hover {
        background: #e4e0d8;
      }
      .tab.on {
        background: #fff;
        color: #000;
        font-weight: bold;
        text-decoration: none;
        height: 26px;
        top: 1px;
      }
      .tp[hidden] {
        display: none;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
        gap: 10px 20px;
      }
      .grid > * {
        min-width: 0;
      }
      .full {
        grid-column: 1/-1;
      }
      .grp {
        grid-column: 1/-1;
        margin: 4px 0 0;
      }
      .grid > .grp:first-child,
      .tp > .grp:first-child {
        margin-top: 0;
      }
      .f label {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 2px;
        color: #000;
      }
      b {
        font: bold 12px var(--mono);
        color: var(--ac);
      }
      .row {
        display: flex;
        flex-wrap: wrap;
        gap: 6px 12px;
        align-items: center;
      }
      .ck {
        display: flex;
        align-items: center;
        gap: 6px;
        cursor: pointer;
      }
      input[type="checkbox"] {
        width: 13px;
        height: 13px;
      }
      .opts {
        grid-column: 1/-1;
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
        gap: 2px 20px;
      }
      .opts .ck {
        align-items: flex-start;
        padding: 2px 0;
      }
      .opts .ck input {
        margin-top: 2px;
        flex: none;
      }
      .opts .ck span {
        flex: 1;
        min-width: 0;
      }
      .actions {
        grid-column: 1/-1;
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      input[type="range"] {
        width: 100%;
        height: 20px;
        margin: 0;
      }
      .fg {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
        gap: 8px;
        margin-top: 10px;
      }
      .fg canvas {
        width: 100%;
        border: 2px inset var(--bd2);
        background: #000;
        cursor: pointer;
      }
      .ob {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 4px 0;
        border-bottom: 1px solid #ddd;
      }
      .ob span {
        flex: 1;
        min-width: 0;
      }
      .ob i {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        border: 3px solid;
        flex: none;
      }
      .ob button {
        padding: 0 8px;
      }
      .ob em {
        display: block;
        font-style: normal;
        color: var(--mut);
      }
      .lb {
        position: fixed;
        inset: 0;
        background: #000d;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 8px;
        z-index: 9;
        color: #fff;
        font-size: 12px;
      }
      .lb[hidden] {
        display: none;
      }
      .lb img {
        max-width: 92vw;
        max-height: 82vh;
        border: 2px solid #fff;
      }
      .hint {
        color: var(--mut);
        margin-bottom: 8px;
        line-height: 1.4;
      }
      .grid > .hint {
        margin: 0;
      }
      details.adv {
        border-top: 1px solid var(--bd2);
        padding-top: 6px;
      }
      details.adv summary {
        cursor: pointer;
        color: var(--ac);
        margin-bottom: 8px;
      }
      small {
        color: var(--mut);
        font-size: 11px;
      }
      a {
        color: var(--ac);
      }
      @media (max-width: 900px) {
        .content-grid {
          grid-template-columns: 1fr;
        }
        .canvas-col {
          order: -1;
        }
        #cv {
          height: 52vh;
          min-height: 300px;
        }
      }
      @media (max-width: 600px) {
        body {
          padding: 6px;
        }
        .opts {
          grid-template-columns: 1fr;
        }
        .bar button {
          min-width: 0;
          flex: 1;
        }
      }
      html {
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
      }
      body {
        overflow-x: hidden;
      }
      #cv {
        height: 68vh;
        height: 68dvh;
        -webkit-touch-callout: none;
        -webkit-user-select: none;
        user-select: none;
      }
      @media (min-width: 1600px) {
        .container {
          max-width: 1800px;
        }
        .content-grid {
          grid-template-columns: 340px minmax(0, 1fr);
        }
      }
      @media (min-width: 901px) and (max-width: 1100px) {
        .content-grid {
          grid-template-columns: 240px minmax(0, 1fr);
        }
      }
      @media (max-width: 900px) {
        #cv {
          height: 56vh;
          height: 56dvh;
          min-height: 300px;
        }
      }
      @media (max-width: 600px) {
        .grid {
          grid-template-columns: 1fr;
        }
        .hd h1 {
          font-size: 18px;
        }
        #cv {
          height: 52vh;
          height: 52dvh;
          min-height: 280px;
        }
        .tabs {
          margin-left: -8px;
          margin-right: -8px;
        }
      }
      @media (max-height: 500px) and (orientation: landscape) {
        .content-grid {
          grid-template-columns: 1fr;
        }
        .canvas-col {
          order: -1;
        }
        #cv {
          height: calc(100vh - 90px);
          height: calc(100dvh - 90px);
          min-height: 220px;
          max-height: none;
        }
      }
      @media (pointer: coarse) {
        button,
        select,
        input[type="text"],
        input:not([type]) {
          height: 40px;
          font-size: 16px;
        }
        .tab {
          height: 40px;
        }
        .tab.on {
          height: 42px;
        }
        input[type="checkbox"] {
          width: 20px;
          height: 20px;
        }
        input[type="range"] {
          height: 34px;
        }
        .bar button {
          min-width: 88px;
        }
        .opts .ck {
          padding: 6px 0;
        }
        .ob button {
          height: 36px;
        }
      }

      .hd {
        border-bottom: 2px solid var(--hd);
      }
      .info-panel,
      .controls,
      .canvas-container,
      .fg canvas {
        border: 1px solid #b8bec9;
      }
      .canvas-container {
        border-color: #8a93a3;
      }
      .info-panel h3,
      .grp {
        background: #eaf0fb;
        color: var(--hd);
        border-left: 3px solid var(--hd);
      }
      .info-row {
        border-bottom: 1px solid #e6e9ef;
      }
      .bar {
        border-top: 1px solid #b8bec9;
        background: #f4f6fa;
      }
      button {
        background: #eef1f6;
        border: 1px solid #b8bec9;
        color: #111;
      }
      button:hover {
        background: #e0e7f2;
        border-color: var(--hd);
      }
      button:active {
        background: #cfd9ea;
        border-style: solid;
      }
      button.p {
        background: var(--hd);
        border-color: var(--hd);
        color: #fff;
        font-weight: bold;
      }
      button.p:hover {
        background: #0a4ac0;
      }
      select,
      input[type="text"],
      input:not([type]) {
        border: 1px solid #b8bec9;
        background: #fff;
      }
      select:focus,
      input:focus {
        border-color: var(--hd);
        outline: none;
      }
      .tabs {
        border-bottom: 1px solid #b8bec9;
        padding: 0;
      }
      .tab {
        background: none;
        border: 0;
        border-bottom: 3px solid transparent;
        color: #333;
        text-decoration: none;
        top: 0;
        font-weight: bold;
      }
      .tab:hover {
        background: #eef1f6;
      }
      .tab.on {
        background: none;
        color: var(--hd);
        border-bottom-color: var(--hd);
        text-decoration: none;
      }
      .lb img {
        border: 0;
      }

      /* uniform type and controls */
      :root {
        --fs: 12px;
        --fam: Verdana, Geneva, Arial, sans-serif;
        --h: 28px;
      }
      @media (pointer: coarse) {
        :root {
          --fs: 16px;
          --h: 40px;
        }
      }
      body * {
        font-family: var(--fam) !important;
        font-size: var(--fs) !important;
      }
      .hd h1 {
        font-size: calc(var(--fs) * 1.5) !important;
      }
      .beta {
        vertical-align: baseline !important;
        font-size: var(--fs) !important;
      }
      button,
      select,
      input[type="text"],
      input:not([type]),
      .tab,
      .tab.on {
        height: var(--h) !important;
      }
      button,
      select,
      input[type="text"],
      input:not([type]) {
        padding: 0 10px;
      }
      select {
        padding-right: 6px;
      }
      .info-panel,
      .controls {
        padding: 10px;
      }
      .content-grid {
        gap: 10px;
      }
      .grid {
        gap: 10px 16px;
      }
      .info-row {
        padding: 3px 4px;
      }
      input[type="checkbox"] {
        width: 14px;
        height: 14px;
      }
      @media (pointer: coarse) {
        input[type="checkbox"] {
          width: 20px;
          height: 20px;
        }
      }
      /* desktop and laptop: three-column app layout that fits the window */
      @media (min-width: 1100px) and (min-height: 560px) {
        html,
        body {
          height: 100%;
          overflow: hidden;
        }
        body {
          padding: 8px;
        }
        .container {
          display: grid;
          grid-template-columns: minmax(220px, 260px) minmax(0, 1fr) minmax(330px, 400px);
          grid-template-rows: auto minmax(0, 1fr);
          gap: 8px;
          max-width: none;
          height: 100%;
        }
        .hd {
          grid-column: 1/-1;
          margin: 0;
        }
        .content-grid {
          display: contents;
        }
        .info-panel {
          grid-column: 1;
          grid-row: 2;
          overflow-y: auto;
          min-height: 0;
        }
        .canvas-col {
          grid-column: 2;
          grid-row: 2;
          min-height: 0;
          order: 0;
        }
        .controls {
          grid-column: 3;
          grid-row: 2;
          overflow-y: auto;
          min-height: 0;
        }
        .canvas-container {
          height: 100%;
          display: flex;
          flex-direction: column;
        }
        #cv {
          flex: 1 1 0;
          height: auto !important;
          min-height: 0 !important;
          max-height: none !important;
        }
        .controls .tabs {
          position: sticky;
          top: -10px;
          z-index: 2;
          background: var(--pn);
          padding-top: 10px;
          margin-top: -10px;
        }
      }
      @media (min-width: 1600px) {
        .container {
          grid-template-columns: 280px minmax(0, 1fr) 440px;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <header class="hd">
        <h1>StarryFlameSPH <span class="beta">BETA</span></h1>
      </header>
      <div class="content-grid">
        <div class="info-panel">
          <h3>Simulation Status</h3>
          <div class="info-table" id="pr"></div>
          <h3>Selected Object</h3>
          <select id="sel"></select>
          <div class="info-table" id="bp" style="margin-top: 8px"></div>
        </div>
        <div class="canvas-col">
          <div class="canvas-container">
            <canvas id="cv"></canvas>
            <div class="bar">
              <button id="pl" class="p">Pause</button><button id="rs">Restart</button
              ><button id="rv">Reset Camera</button>
              <div class="f">
                <label>Simulation Speed (hours per second) <b id="spd_v"></b></label
                ><input id="spd" type="range" min=".1" max="24" step=".1" value="1" />
              </div>
            </div>
          </div>
        </div>
      </div>
      <div class="controls">
        <nav class="tabs">
          <button class="tab on" data-t="scn">Scenarios</button
          ><button class="tab" data-t="obj" id="tabo" style="display: none">Add Objects</button
          ><button class="tab" data-t="phy">Physics</button
          ><button class="tab" data-t="dsp">Appearance</button
          ><button class="tab" data-t="snp">Snapshots</button>
        </nav>
        <section class="tp" id="t_scn">
          <div class="grid">
            <h4 class="grp">Choose a Scenario</h4>
            <div class="f full">
              <label>Scenario</label
              ><select id="pre"></select>
            </div>
            <div id="std" class="grid full">
              <h4 class="grp">Collision Setup</h4>
              <div class="f">
                <label>Impactor Size (compared to target planet) <b id="g_v"></b></label
                ><input id="g" type="range" min="0.02" max="1" step="0.01" />
              </div>
              <div class="f">
                <label>Impact Angle (0 = head-on, 1 = glancing) <b id="b_v"></b></label
                ><input id="b" type="range" min="0" max="1.6" step="0.05" />
              </div>
              <div class="f">
                <label>Impact Speed (0 = just falling in) <b id="vi_v"></b></label
                ><input id="vi" type="range" min="0" max="4" step="0.05" />
              </div>
              <h4 class="grp">Planet Interior and Rotation</h4>
              <div class="f">
                <label>Target Planet Core Size <b id="cf_v"></b></label
                ><input id="cf" type="range" min="0" max="0.7" step="0.05" />
              </div>
              <div class="f">
                <label>Impactor Core Size <b id="cfi_v"></b></label
                ><input id="cfi" type="range" min="0" max="0.7" step="0.05" />
              </div>
              <div class="f">
                <label
                  >Target Rotation (fraction of breakup spin, negative = backwards)
                  <b id="sp_v"></b></label
                ><input id="sp" type="range" min="-0.6" max="0.6" step="0.05" />
              </div>
            </div>
          </div>
        </section>
        <section class="tp" id="t_obj" hidden>
          <div class="grid">
            <div class="f">
              <label>Planet Type</label
              ><select id="tpl">
                <option value="">Custom</option>
                <option value="earth">Earth-like Planet</option>
                <option value="mars">Mars-like Planet</option>
                <option value="moon">Moon-like Body</option>
                <option value="mercury">Mercury-like Planet</option>
              </select>
            </div>
            <div class="f">
              <label>Mass (in Earth masses) <b id="om_v"></b></label
              ><input id="om" type="range" min="0.005" max="4" step="0.005" value="1" />
            </div>
            <div class="f">
              <label>Iron Core Size <b id="oc_v"></b></label
              ><input id="oc" type="range" min="0" max="0.7" step="0.05" value="0.3" />
            </div>
            <div class="f">
              <label>Starting Speed (km/s) <b id="os_v"></b></label
              ><input id="os" type="range" min="0" max="40" step="1" value="0" />
            </div>
            <div class="f">
              <label>Starting Direction (°, 0 = right) <b id="od_v"></b></label
              ><input id="od" type="range" min="0" max="355" step="5" value="180" />
            </div>
            <div class="f">
              <label>Rotation (fraction of breakup spin) <b id="oy_v"></b></label
              ><input id="oy" type="range" min="-0.6" max="0.6" step="0.05" value="0" />
            </div>
            <div class="f">
              <label>Colour</label
              ><select id="oh">
                <option value="blue">Blue</option>
                <option value="red">Red</option>
                <option value="green">Green</option>
                <option value="yellow">Yellow</option>
              </select>
            </div>
            <div class="f">
              <label>Starting Motion</label
              ><select id="omode">
                <option value="">Use the speed and direction above</option>
                <option value="p">Orbit the heaviest object</option>
                <option value="r">Orbit the heaviest object (backwards)</option>
              </select>
            </div>
            <div class="f">
              <label>Orbit Shape (0 = circle) <b id="oe_v"></b></label
              ><input id="oe" type="range" min="0" max="0.9" step="0.05" value="0" />
            </div>
            <div class="f">
              <label>When Dragging an Object</label
              ><select id="dm">
                <option value="v">Sets its speed and direction</option>
                <option value="m">Moves it</option>
              </select>
            </div>
            <div class="opts">
              <label class="ck"
                ><input type="checkbox" id="pm" checked /><span
                  >Tap the canvas to add a body</span
                ></label
              >
            </div>
            <div class="actions">
              <button id="bl" class="p">Start Simulation</button
              ><button id="be">Edit Objects</button><button id="bc">Remove All Objects</button>
            </div>
            <div id="ol" class="full"></div>
          </div>
        </section>
        <section class="tp" id="t_phy" hidden>
          <div class="grid">

            row("Circular speed", (Math.sqrt((GG * m) / rad) * VU).toFixed(1) + " km/s") +
            row("Temperature", Math.round(Tk) + " K") +
            row("Sim speed", vk.toFixed(1) + " km/s")
          : "<small>No body yet</small>";
      }
      let BQA = 1,
        ACT = 0,
        DMS = 6,
        WE = false,
        ENOW,
        PNOW,
        LNOW,
        L0,
        dtp = 0,
        DTM = 0.02,
        tgt = 0,
        eff = 1,
        fps = 60,
        last = performance.now();
      const AF = q("af");
      function frame() {
        const now = performance.now(),
          fd = Math.min(0.1, (now - last) / 1000);
        last = now;
        const MSB = Math.max(3, Math.min(13, 15 - DMS));
        COL = q("co").checked;
        IC = q("ic").checked;
        GHON = q("gh").checked;
        TG = q("tg").checked;
        RH = q("rh").checked;
        if (fd > 0) fps += (1 / fd - fps) * 0.05;
        if (run && !(SB && edit)) {
          const t0 = performance.now(),
            B = Math.min(30, Math.max(8, 0.75 * fd * 1000));
          if (relax > 0) {
            while (relax > 0 && performance.now() - t0 < B) stepSim(1);
          } else {
            const per = fd * 4.45 * +q("spd").value * eff;
            tgt = Math.min(tgt + per, T + 2 * per + DTM);
            while (tgt - T > 0.3 * DTM && performance.now() - t0 < MSB) {
              stepSim((tgt - T) / Math.ceil((tgt - T) / DTM));
            }
            if (tgt - T > 0.6 * per + DTM) eff = Math.max(0.02, eff * 0.97);
            else eff = Math.min(1, eff * 1.01);
          }
        }
        while (snapI < snapT.length && (T * 809) / 3600 >= snapT[snapI]) {
          snap();
          snapI++;
        }
        if (run || (SB && edit) || now - ACT < 500 || frameN % 6 == 0) {
          const td = performance.now();
          draw();
          DMS += (performance.now() - td - DMS) * 0.1;
          BQA = Math.max(0.5, Math.min(1, BQA * (DMS > 14 ? 0.97 : DMS < 7 ? 1.01 : 1)));
        }
        frameN++;
        if (frameN % 30 == 29 && relax == 0) WE = true;
        if (frameN % 15 == 0) {
          if (relax == 0 && frameN % 30 == 0) calc();
          upd();
        }
        requestAnimationFrame(frame);
      }
      q("rv").onclick = () => {
        AF.checked = false;
        px = py = 0;
        zoom = 1;
      };
      document.querySelectorAll(".tab").forEach((b) => (b.onclick = () => tab(b.dataset.t)));
      addEventListener("keydown", (e) => {
        if (/INPUT|SELECT|TEXTAREA/.test(e.target.tagName) || e.ctrlKey || e.metaKey || e.altKey)
          return;
        if (e.code == "Space") {
          e.preventDefault();
          q("pl").click();
        } else if (e.key == "r") q("rs").click();
        else if (e.key == "s") q("sn").click();
        else if (e.key == "f") AF.click();
      });
      ["pointerdown", "pointermove", "wheel", "input", "change", "keydown", "resize"].forEach((e) =>
        addEventListener(
          e,
          () => {
            ACT = performance.now();
          },
          { passive: true },
        ),
      );
      rs();
      applyPre();
      upd();
      frame();
    </script>
  </body>
</html>
